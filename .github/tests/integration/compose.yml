name: "integration"

x-lockdown: &lockdown
  read_only: true
  security_opt:
    - "no-new-privileges=true"

services:
  main:
    image: "${IMAGE}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/localhealth", "http://127.0.0.1:8080/", "-I"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 30s
    <<: *lockdown
    environment:
      TZ: "Europe/Zurich"
    volumes:
      - "sabnzbd.etc:/sabnzbd/etc"
    tmpfs:
      - "/tmp:uid=1000,gid=1000"
    ports:
      - "8080:8080/tcp"
    networks:
      frontend:
    restart: "always"

volumes:
  sabnzbd.etc:

networks:
  frontend: